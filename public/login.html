<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Listas LA FEFA BAR - Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=SF+Pro+Display:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', sans-serif;
      background: #f5f5f7;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .login-container {
      background: white;
      border-radius: 18px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.08);
      padding: 48px;
      width: 100%;
      max-width: 380px;
    }

    .logo {
      text-align: center;
      margin-bottom: 40px;
    }

    .logo-image {
      width: 80px;
      height: 80px;
      margin-bottom: 12px;
      display: block;
      margin-left: auto;
      margin-right: auto;
    }

    .logo h1 {
      color: #000;
      font-size: 28px;
      font-weight: 700;
      letter-spacing: -0.5px;
      margin-bottom: 4px;
    }

    .logo p {
      color: #86868b;
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0.3px;
      text-transform: uppercase;
    }

    .form-group {
      margin-bottom: 16px;
    }

    label {
      display: block;
      color: #000;
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 8px;
      letter-spacing: 0.3px;
    }

    input {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid #d2d2d7;
      border-radius: 10px;
      font-size: 15px;
      font-family: inherit;
      transition: all 0.2s ease;
      background: white;
      color: #000;
    }

    input:focus {
      outline: none;
      border-color: #000;
      box-shadow: 0 0 0 3px rgba(0, 0, 0, 0.05);
    }

    input::placeholder {
      color: #a1a1a6;
    }

    button {
      width: 100%;
      padding: 13px;
      background: #000;
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      margin-top: 24px;
      letter-spacing: 0.3px;
    }

    button:hover {
      background: #1a1a1a;
    }

    button:active {
      transform: scale(0.98);
    }

    .error {
      color: #ff3b30;
      font-size: 13px;
      margin-top: 8px;
      display: none;
      padding: 10px;
      background: #fff5f5;
      border-radius: 8px;
      border-left: 3px solid #ff3b30;
    }

    .error.show {
      display: block;
    }

    @media (max-width: 480px) {
      .login-container {
        padding: 32px 20px;
        margin: 16px;
      }

      .logo h1 {
        font-size: 24px;
      }
    }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="logo">
      <img src="/logo.svg" alt="LA FEFA BAR" class="logo-image">
      <h1>LA FEFA BAR</h1>
      <p>Gestão de Listas</p>
    </div>

    <form id="loginForm">
      <div class="form-group">
        <label for="username">Usuário</label>
        <input type="text" id="username" placeholder="lafefa" required>
      </div>
      <div class="form-group">
        <label for="password">Senha</label>
        <input type="password" id="password" placeholder="••••••••" required>
      </div>
      <div class="error" id="errorMsg"></div>
      <button type="submit">ENTRAR</button>
    </form>
  </div>

  <script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;
      const errorMsg = document.getElementById('errorMsg');

      try {
        const response = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });

        if (response.ok) {
          window.location.href = '/';
        } else {
          errorMsg.textContent = 'Usuário ou senha incorretos';
          errorMsg.classList.add('show');
        }
      } catch (err) {
        errorMsg.textContent = 'Erro ao conectar';
        errorMsg.classList.add('show');
      }
    });
  </script>
</body>
</html>
